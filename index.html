    <script>
      /* 首屏渲染前恢复上次选择的主题（默认深色），并同步手机浏览器地址栏配色，避免闪帧 */
      try {
        var light = localStorage.getItem('liukai-theme') === 'light';
        if (light) document.documentElement.dataset.theme = 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', light ? '#f4f7fb' : '#0B0F10');
      } catch (e) {}
    </script>
