<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">小智 AI · 轻量化陪伴终端</title>
<desc id="desc">中央 AI 模组连接毛绒玩具、挂脖玩具、口袋伴侣和桌面终端，下方展示语音互动、情感陪伴和记忆训练。</desc>
